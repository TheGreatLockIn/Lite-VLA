[project]
name = "litevla"
version = "0.1.0"
description = "On-device Vision-Language-Action inference for robotic control"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["litevla", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.lint.per-file-ignores]
# Scripts adjust sys.path before importing the local package.
"scripts/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
